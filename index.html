<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mediawhop — End-to-End Google Ads Management</title>
<meta name="description" content="Expert hands-on Google Ads management. Insider knowledge, full transparency, human partnership — not vanity metrics.">
<!-- Google SEO Canonical Setup -->
<link rel="canonical" href="https://mediawhop.com" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230A0F1C%22/><text x=%2250%22 y=%2270%22 font-size=%2264%22 fill=%22%234285F4%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-weight=%22800%22>m</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0A0F1C;
    --bg-1:#0D1424;
    --bg-2:#111A2E;
    --surface:rgba(255,255,255,0.035);
    --surface-strong:rgba(255,255,255,0.06);
    --border:rgba(255,255,255,0.09);
    --border-soft:rgba(255,255,255,0.06);
    --text:#EAF0FB;
    --text-soft:#96A2BC;
    --text-faint:#5E6A85;
    --blue:#4285F4;
    --blue-soft:rgba(66,133,244,0.16);
    --green:#34A853;
    --green-soft:rgba(52,168,83,0.16);
    --waste:#FF6B57;
    --waste-soft:rgba(255,107,87,0.14);
    --display:'Poppins', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --maxw:1140px;
    --ease:cubic-bezier(.19,1,.22,1);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 78% -8%, #16213B 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at -5% 20%, #131D33 0%, transparent 55%),
      var(--bg-0);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--display);
    font-weight:400;
    font-size:1.02rem;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  a{color:inherit;}
  img,svg,canvas{display:block;max-width:100%;}

  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px; position:relative; z-index:2;}

  ::selection{ background:var(--blue); color:#fff; }

  /* ---------- scroll progress ---------- */
  #progress{
    position:fixed; top:0; left:0; height:2.5px; width:0%;
    background:linear-gradient(90deg, var(--blue), var(--green));
    z-index:200; transition:width 0.1s linear;
  }

  /* ---------- reveal ---------- */
  .reveal{ opacity:0; transform:translateY(22px); transition:opacity 0.7s var(--ease), transform 0.7s var(--ease); }
  .reveal.in-view{ opacity:1; transform:translateY(0); }

  /* ---------- typography ---------- */
  .label{ font-family:var(--mono); font-size:0.72rem; letter-spacing:0.02em; color:var(--text-soft); }
  h1,h2,h3{ font-family:var(--display); font-weight:700; margin:0; letter-spacing:-0.01em; color:var(--text); }

  /* ---------- logo ---------- */
  .logo{
    font-family:var(--display);
    font-weight:800;
    font-size:1.55rem;
    text-decoration:none;
    letter-spacing:-0.01em;
    display:inline-flex;
    position:relative;
  }
  .logo .lm{ color:var(--blue); }
  .logo .lw{
    background:linear-gradient(100deg, var(--green) 0%, #5FD489 50%, var(--green) 100%);
    background-size:220% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 6s linear infinite;
  }
  @keyframes shimmer{ to{ background-position:-220% center; } }

  /* ---------- nav ---------- */
  header.site{
    position:sticky; top:0; z-index:100;
    background:rgba(10,15,28,0.72);
    backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--border-soft);
  }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; max-width:var(--maxw); margin:0 auto; }
  nav.links{ display:flex; gap:30px; align-items:center; font-family:var(--mono); font-size:0.76rem; }
  nav.links a{
    text-decoration:none; color:var(--text-soft);
    position:relative; padding-bottom:3px;
    transition:color 0.2s ease;
  }
  nav.links a::after{
    content:""; position:absolute; left:0; bottom:0; height:1px; width:0%;
    background:linear-gradient(90deg,var(--blue),var(--green));
    transition:width 0.25s var(--ease);
  }
  nav.links a:hover, nav.links a.active{ color:var(--text); }
  nav.links a:hover::after, nav.links a.active::after{ width:100%; }

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:0.8rem;
    padding:12px 20px;
    text-decoration:none;
    border:1px solid var(--border);
    cursor:pointer;
    background:var(--surface);
    color:var(--text);
    border-radius:8px;
    position:relative; overflow:hidden;
    isolation:isolate;
    transition:border-color 0.25s ease, transform 0.2s ease, background 0.25s ease;
  }
  .btn:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,0.22); }
  .btn:active{ transform:translateY(0); }
  .btn-solid{ background:linear-gradient(120deg, var(--blue), #3f7be0); border-color:transparent; color:#fff; }
  .btn-solid:hover{ box-shadow:0 8px 28px -8px var(--blue-soft), 0 0 0 1px rgba(66,133,244,0.35); }
  .btn-ghost:hover{ background:var(--surface-strong); }
  .btn-glow::before{
    content:""; position:absolute; inset:0; z-index:-1;
    background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.16), transparent 60%);
    opacity:0; transition:opacity 0.25s ease;
  }
  .btn-glow:hover::before{ opacity:1; }

  .nav-cta{ padding:10px 18px; font-size:0.78rem; }
  .menu-btn{ display:none; }
  @media (max-width: 860px){
    nav.links{ display:none; }
    .menu-btn{ display:inline-flex; border:1px solid var(--border); background:var(--surface); border-radius:8px; font-family:var(--mono); font-size:0.75rem; padding:9px 12px; color:var(--text); }
  }

  /* ---------- hero ---------- */
  .hero{ position:relative; padding:64px 0 90px; overflow:hidden; }
  #particles{ position:absolute; inset:0; width:100%; height:100%; z-index:0; opacity:0.85; pointer-events:none; }
  .hero-grid{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:start; position:relative; z-index:2; }
  @media (max-width: 900px){ .hero-grid{ grid-template-columns:1fr; } }
  @media (min-width: 901px){ .hero-grid > div:last-child{ margin-top:42px; } }

  .hero-badge{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:0.72rem; color:var(--text-soft);
    border:1px solid var(--border); background:var(--surface);
    padding:7px 13px; border-radius:100px; margin-bottom:26px;
  }
  .hero-badge .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }

  .hero h1{
    font-size:clamp(2.2rem, 4vw + 1rem, 3.5rem);
    line-height:1.12;
    max-width:15ch;
    opacity:0; transform:translateY(18px);
    animation:heroIn 0.9s var(--ease) 0.15s forwards;
  }
  .hero p.sub{
    margin-top:22px; max-width:44ch; color:var(--text-soft); font-size:1.08rem;
    opacity:0; transform:translateY(18px);
    animation:heroIn 0.9s var(--ease) 0.32s forwards;
  }
  .hero-ctas{
    margin-top:32px; display:flex; gap:14px; flex-wrap:wrap;
    opacity:0; transform:translateY(18px);
    animation:heroIn 0.9s var(--ease) 0.48s forwards;
  }
  .hero-tagline{
    margin-top:46px; font-family:var(--mono); font-size:0.76rem; color:var(--text-faint);
    opacity:0; animation:fadeIn 1s var(--ease) 0.7s forwards;
  }
  @keyframes heroIn{ to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ to{ opacity:1; } }

  /* ---------- receipt / calculator card ---------- */
  .receipt{
    position:relative; z-index:2;
    background:linear-gradient(180deg, var(--surface-strong), var(--surface));
  }
</style>
</head>

</body>
</html>
